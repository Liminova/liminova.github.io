name: Weekly Dependency Update

on:
    schedule:
        - cron: '0 2 * * 1' # Runs every Monday at 9:00 AM UTC+7
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: latest

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install

            - run: pnpm update

            - name: Check for changes
              id: changes
              run: |
                  if ! git diff --quiet; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Run checks
              if: steps.changes.outputs.changed == 'true'
              id: check
              continue-on-error: true
              run: pnpm check

            - name: Auto-merge on success
              if: steps.changes.outputs.changed == 'true' && steps.check.outcome == 'success'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "chore(deps): weekly dependency update"
                  git push

            - name: Create PR on failure
              if: steps.changes.outputs.changed == 'true' && steps.check.outcome == 'failure'
              uses: peter-evans/create-pull-request@v8.1.1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  commit-message: 'chore(deps): weekly dependency update'
                  title: 'chore(deps): weekly dependency update'
                  branch: chore/update-deps
                  delete-branch: true
                  labels: dependencies
